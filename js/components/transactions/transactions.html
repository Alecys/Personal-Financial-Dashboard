<section class="section-transactions panel">

    <div class="panel-header">

        <div>

            <div class="panel-title">
                Transactions
            </div>

            <div
                class="panel-subtitle"
                data-transactions-count
            ></div>

        </div>

        <div class="transactions-actions">

            <button
                class="transaction-sort"
                data-transactions-action="sort"
                aria-label="Change sorting"
                title="Change sorting"
            >
                ⇅
            </button>

            <button
                class="transaction-add"
                data-transactions-action="add"
            >
                + Add
            </button>

        </div>

    </div>

    <div
        class="transactions-list"
        data-transactions-list
    ></div>

</section>
